<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Admin Login — Giro Bicicleta</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Sora:wght@400;700;800;900&family=Public+Sans:wght@400;500;600;700;800;900&display=swap" rel="stylesheet" />
    <link rel="icon" type="image/png" href="{{ url_for('static', filename='img/giro_quetzal_red.png') }}" />
    <link rel="stylesheet" href="{{ url_for('static', filename='css/admin/admin.css') }}" />
</head>
<body>
    <main class="admin-shell admin-login-shell">
        <section class="panel">
            <div class="brand-row" style="margin-bottom:.75rem;">
                <img class="brand-logo" src="{{ url_for('static', filename='img/giro_quetzal_red.png') }}" alt="Giro Bicicleta" />
                <p class="eyebrow">Giro Bicicleta</p>
            </div>
            <h1>Admin</h1>
            <p class="muted" style="margin-bottom:1.5rem;">Ingresa con tu cuenta admin para ver el estado del sistema.</p>

            <form method="post" class="form-grid" novalidate>
                {% if notice_message %}
                    <p class="info-box">{{ notice_message }}</p>
                {% endif %}

                <div class="form-field">
                    <label for="username">Usuario</label>
                    <input
                        id="username"
                        name="username"
                        type="text"
                        autocomplete="username"
                        value="{{ username_value }}"
                        placeholder="nombre de usuario"
                        required
                    />
                </div>

                <div class="form-field">
                    <label for="password">Contraseña</label>
                    <input
                        id="password"
                        name="password"
                        type="password"
                        autocomplete="current-password"
                        placeholder="••••••••"
                        required
                    />
                </div>

                {% if error_message %}
                    <p class="error-box">{{ error_message }}</p>
                {% endif %}

                <button type="submit" class="btn btn-primary" style="width:100%;margin-top:.5rem;">
                    Entrar al dashboard
                    <svg width="14" height="14" viewBox="0 0 20 20" fill="none" style="margin-left:6px;">
                        <path d="M4 10h12M11 5l5 5-5 5" stroke="#fff" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
                    </svg>
                </button>
            </form>
        </section>
    </main>
</body>
</html>
