<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Crear Cuenta – GIRO</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="icon" type="image/png" href="{{ url_for('static', filename='img/giro_quetzal_red.png') }}" />
    <link rel="stylesheet" href="{{ url_for('static', filename='css/mobile/giro.css') }}" />
</head>
<body>
<div class="g-login-wrap">
    <div class="g-login-card g-rise">

        <div style="text-align:center; margin-bottom:3.5rem;">
            <img class="g-login-logo" src="{{ url_for('static', filename='img/giro_quetzal_red.png') }}" alt="" />
            <p class="g-login-name">GIRO</p>
            <p class="g-login-sub">Crear Cuenta</p>
        </div>

        {% if error_message %}
        <p class="g-err" style="margin-bottom:1.5rem;">{{ error_message }}</p>
        {% endif %}

        <form method="POST" action="{{ url_for('mobile_register_page') }}" style="display:flex; flex-direction:column; gap:2.5rem;">
            <div class="g-field">
                <label class="g-field-label" for="name">Nombre completo</label>
                <input class="g-input" id="name" name="name" type="text"
                       placeholder="Tu nombre"
                       value="{{ form_values.get('name', '') }}" autocomplete="name" />
            </div>

            <div class="g-field">
                <label class="g-field-label" for="username">Usuario</label>
                <input class="g-input" id="username" name="username" type="text"
                       placeholder="usuario@giro.app"
                       value="{{ form_values.get('username', '') }}" autocomplete="username" />
            </div>

            <div class="g-field">
                <label class="g-field-label" for="email">Correo Electrónico</label>
                <input class="g-input" id="email" name="email" type="email"
                       placeholder="correo@ejemplo.com"
                       value="{{ form_values.get('email', '') }}" autocomplete="email" />
            </div>

            <div class="g-field">
                <label class="g-field-label" for="password">Clave de Acceso</label>
                <div class="g-pw-wrap">
                    <input class="g-input" id="password" name="password" type="password"
                           placeholder="Mínimo 8 caracteres" autocomplete="new-password" />
                    <button type="button" class="g-pw-toggle" aria-label="Mostrar contraseña" data-target="password">
                        <svg class="g-eye-show" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
                        <svg class="g-eye-hide" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="display:none"><path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"/><line x1="1" y1="1" x2="23" y2="23"/></svg>
                    </button>
                </div>
            </div>

            <div class="g-field">
                <label class="g-field-label" for="confirm_password">Confirmar Clave</label>
                <div class="g-pw-wrap">
                    <input class="g-input" id="confirm_password" name="confirm_password" type="password"
                           placeholder="Repite tu clave" autocomplete="new-password" />
                    <button type="button" class="g-pw-toggle" aria-label="Mostrar contraseña" data-target="confirm_password">
                        <svg class="g-eye-show" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
                        <svg class="g-eye-hide" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="display:none"><path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"/><line x1="1" y1="1" x2="23" y2="23"/></svg>
                    </button>
                </div>
            </div>

            <button type="submit" class="g-btn g-btn-primary" style="margin-top:.5rem;">
                Crear Cuenta
            </button>
        </form>

        <div class="g-login-divider">
            <div class="g-login-divider-line"></div>
            <span class="g-login-divider-text">¿Ya tienes cuenta?</span>
            <div class="g-login-divider-line"></div>
        </div>

        <a href="{{ url_for('mobile_login_page') }}" class="g-btn g-btn-secondary" style="display:block; text-align:center; text-decoration:none;">
            Iniciar Sesión
        </a>
    </div>
</div>
<script>
document.querySelectorAll('.g-pw-toggle').forEach(btn => {
    btn.addEventListener('click', () => {
        const input = document.getElementById(btn.dataset.target);
        const showing = input.type === 'text';
        input.type = showing ? 'password' : 'text';
        btn.querySelector('.g-eye-show').style.display = showing ? '' : 'none';
        btn.querySelector('.g-eye-hide').style.display = showing ? 'none' : '';
    });
});
</script>
</body>
</html>
